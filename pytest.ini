[pytest]
pythonpath = .
testpaths = tests
# Fail on an unregistered marker rather than silently skipping the filter, and
# surface config typos instead of ignoring them.
addopts = --strict-markers --strict-config
filterwarnings =
    default
    # A test asserting no PHI leaks is worthless if it passes because a
    # DeprecationWarning swallowed the assertion path; keep warnings visible
    # but do not fail the suite on third-party deprecations.
    ignore::DeprecationWarning:pydicom.*
markers =
    integration: requires a live Redis or Pub/Sub emulator; skipped when absent.
