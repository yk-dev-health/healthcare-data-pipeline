name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # weasyprint (a transitive dependency pulled in via
      # clinical-data-quality-analysis, see requirements.txt) needs Pango,
      # Cairo and GDK-Pixbuf at import time; none of this pipeline's own code
      # renders PDFs, but the sibling repo's contracts module still imports
      # weasyprint indirectly through its package __init__, so the native libs
      # have to be present for `pip install` and `import healthcli.contracts`
      # to succeed on a bare Ubuntu runner.
      - name: Install native libraries for weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v

      - name: Verify the API app imports cleanly
        run: python -c "from api.main import app; print('OK:', app.title, app.version)"
